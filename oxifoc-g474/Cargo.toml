[package]
name = "oxifoc-g474"
version = "0.1.0"
edition = "2024"
description = "STM32G474-based motor controller (NUCLEO-G474RE board)"

[[bin]]
name = "oxifoc-g474"
path = "src/main.rs"
test = false
bench = false

[features]
default = []

[dependencies]
# Embassy dependencies (main branch with async flash support for G4)
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }
embassy-futures = { version = "0.1.2", features = ["defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }
embassy-stm32 = { version = "0.6.0", features = ["stm32g474re", "time-driver-tim5", "unstable-pac", "dual-bank", "defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }
embassy-sync = { version = "0.8.0", features = ["defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768", "defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }

# Cortex-M dependencies
cortex-m = { version = "0.7.8", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.6"
critical-section = "1.2"

# Debugging and logging
defmt = "1.1.1"

# Serialization
serde = { version = "1.0.229", features = ["derive"], default-features = false }
postcard-schema = "0.2.5"

# Synchronization
mutex = "1.0.2"

# Local dependencies + CAN protocol
oxifoc-core = { path = "../oxifoc-core", features = ["runtime", "defmt", "storage", "embassy", "cordic", "embassy-hal", "hfi", "hfi-detect", "isr-speed"] }
femtopb = { version = "0.8.0", default-features = false }
streaming-protocol = { git = "https://github.com/jakestrj/streaming-protocol", rev = "157cf63" }
nmea = { git = "https://github.com/jakestrj/nmea", rev = "f882d1d" }

static_cell = "2.1"
assign-resources = "0.5.0"
embedded-io-async = { version = "0.7", features = ["defmt"] }
heapless = { version = "0.9.3", default-features = false, features = ["defmt"] }
libm = { version = "0.2.16", default-features = false }

# Persistent configuration storage
sequential-storage = { version = "8.0", features = ["postcard", "defmt"] }
embedded-storage-async = "0.4"
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }
postcard = { version = "1.1", features = ["use-defmt"] }
rtt-target = { version = "0.6", features = ["defmt"] }

[patch.crates-io]
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }

[profile.dev]
debug = true
lto = "fat"
opt-level = 3
incremental = true

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = true

# Verbatim copy of the root [workspace.lints] tables (this crate is excluded
# from the workspace for its target/toolchain) — keep in sync with ../Cargo.toml.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
# Failure-class guardrails (all zero-hit when introduced; cheap insurance):
dbg_macro = "warn"
string_slice = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
large_futures = "warn"
unused_result_ok = "warn"
iter_not_returning_iterator = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"
unused_async = "warn"
# Firmware panic policy (matches the #![warn] block in oxifoc-core/src/lib.rs;
# deliberate fail-fast sites carry #[expect(..., reason = "...")]):
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
