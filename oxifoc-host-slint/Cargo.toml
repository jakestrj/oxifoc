[package]
name = "oxifoc-host-slint"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "oxifoc-host-slint"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["slint/backend-winit", "slint/renderer-skia", "oxifoc-host-lib/desktop"]
android = ["slint/backend-android-activity-06"]

[dependencies]
oxifoc-host-lib = { path = "../oxifoc-host-lib", default-features = false }
oxifoc-core = { workspace = true, features = ["icd", "storage"] }
slint-wgpu-plot = { path = "../slint-wgpu-plot" }
slint = { workspace = true, features = ["accessibility"] }
chrono = "0.4"
crc32fast = "1.5"
crossbeam-channel = { workspace = true }
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
protox = "0.7"
slint-build = { workspace = true }

[dev-dependencies]
femtopb = { workspace = true }

[package.metadata.android]
package = "com.oxifoc.host"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 33

[lints]
workspace = true
