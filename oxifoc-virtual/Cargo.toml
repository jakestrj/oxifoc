[package]
name = "oxifoc-virtual"
version = "0.1.0"
edition = "2024"
description = "Virtual motor controller device with streaming-protocol and NMEA over CAN"

[dependencies]
oxifoc-core = { workspace = true, features = [
    "runtime",
    "virtual-motor",
    "storage",
    "std",
    "log",
    "delivery",
] }

femtopb = { workspace = true }
streaming-protocol = { workspace = true }
nmea = { workspace = true }
tokio = { workspace = true }
critical-section = { version = "1.2", features = ["std"] }
sequential-storage = { version = "8.0", features = ["postcard", "_test"] }
heapless = "0.9"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tokio-util = { version = "0.7.19", features = ["rt"] }
socket2 = "0.6.5"
rand = "0.9"

[lints]
workspace = true
