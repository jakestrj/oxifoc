[package]
name = "oxifoc-host-lib"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop"]
desktop = []
pcan = ["dep:pcbusb", "dep:nb"]

[dependencies]
oxifoc-core = { workspace = true, features = ["icd", "runtime", "storage", "delivery", "pod", "std"] }
femtopb = { workspace = true }
streaming-protocol = { workspace = true }
nmea = { workspace = true }
pcbusb = { workspace = true, optional = true }
nb = { version = "1.1", optional = true }
heapless = "0.9"
socket2 = { version = "0.6.5", features = ["all"] }

tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

anyhow = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
serde_json = "1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "4.0", default-features = false, features = ["tokio"] }

[lints]
workspace = true
